[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: fast, offline, no GPU/LLM/network
    model: requires downloading/loading HF models (slow, GPU recommended)
    llm: requires a running Ollama server
    network: requires internet access
    integration: end-to-end pipeline (combines the above)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning